name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether extension.json's version changed
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          current=$(jq -r .version extension.json)
          previous=""
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            previous=$(git show "$BEFORE:extension.json" 2>/dev/null | jq -r .version 2>/dev/null || echo "")
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          # GitHub's own "Source code" archives are generated straight from
          # the tag and don't include submodule content, so
          # resources/MathJax comes out empty in them. Attach a second
          # archive with the MathJax submodule checked out, so local-mode
          # users ($wgSmjCdnEnabled = false) have a one-download option
          # that doesn't require git.
          git submodule update --init --recursive

          asset_root="SimpleMathJax-$VERSION"
          asset="$asset_root-with-mathjax.tar.gz"
          git archive --format=tar --prefix="$asset_root/" HEAD -o base.tar
          ( cd resources/MathJax && git archive --format=tar --prefix="$asset_root/resources/MathJax/" HEAD -o ../mathjax.tar )
          tar -Af base.tar mathjax.tar
          gzip -c base.tar > "$asset"

          gh release create "$TAG" "$asset" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
