- name: default01
  examples:
    - |
      <math>
      \frac{1}{\Bigl(\sqrt{\phi \sqrt{5}}-\phi\Bigr) e^{\frac25 \pi}} =
      1+\frac{e^{-2\pi}} {1+\frac{e^{-4\pi}} {1+\frac{e^{-6\pi}}
      {1+\frac{e^{-8\pi}} {1+\ldots} } } }
      </math>
    - "<chem>CO2 + C -> 2 CO</chem>"
    - '<math>전압 = 전류 \times 저항</math>'
    - '<math>速さ = \frac{道のり}{時間}</math>'
    - '<math display="block">E=mc^2</math>'
- name: default02
  addDiffShot: true
  addRightClickShot: true
  examples:
    - "<nowiki><math>E=mc^2</math></nowiki>"
    # $wgSmjAllowedAttributes is [] by default, so 'class' is stripped here
    # and this renders anyway — see custom01 for the working version, where
    # $wgSmjAllowedAttributes includes 'class'.
    - '<math class="mathjax_ignore">E=mc^2</math>'
- name: custom01
  addRightClickShot: true
  addDiffShot: true
  settings: |
    $wgSmjCdnEnabled = false;
    $wgSmjScale = 1.5;
    $wgSmjAllowedAttributes = [ 'style', 'class' ];
    $wgSmjExtraDelimitersEnabled = true;
    $wgSmjExtraDelimitersInlineMath = [ [ '$', '$' ] ];
    $wgSmjExtraDelimitersDisplayMath = [ [ '$$', '$$' ] ];
  examples:
    - "<chem>CO2 + C -> 2 CO</chem>"
    - "''Italic'' works."
    - "$y'' = 2a_2 + 6a_3 x$."
    - "'''Bold''' works."
    - "$f'''(x) = 6a_3$"
    - '$$e^{i\pi} + 1 = 0$$'
    - '<math style="color: red">e^{i\pi} + 1 = 0</math>'
    - '<math class="mathjax_ignore">E=mc^2</math>'
    - "<nowiki><math>E=mc^2</math></nowiki>"
    - '<math display="block">e^{i\pi} + 1 = 0</math>'
- name: custom02
  addDiffShot: true
  settings: |
    $wgSmjExtraDelimitersEnabled = true;
    $wgSmjExtraDelimitersInlineMath = [ [ '$', '$' ] ];
    $wgSmjExtraDelimitersDisplayMath = [ [ '$$', '$$' ] ];
    // Don't: the default is already good.
    // Blanked to show diffs rendering unnecessarily.
    $wgSmjIgnoreHtmlClass = 'mathjax_ignore';
  examples:
    - "$y' = 2a_2 + 6a_3 x$."
    - '$$e^{i\pi} + 1 = 0$$'
